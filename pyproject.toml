[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-capacity-coordination"
version = "0.1.0"
description = "Research framework for coordinating maintenance demand and technician capacity."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.1,<2",
    "numpy>=2.1,<3",
    "torch==2.14.0",
    "sb3-contrib>=2.6,<3",
    "stable-baselines3>=2.6,<3",
    "tqdm>=4.67,<5",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
mcc-smoke = "maintenance_capacity_coordination.smoke:main"
mcc-v14 = "maintenance_capacity_coordination.v14:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
